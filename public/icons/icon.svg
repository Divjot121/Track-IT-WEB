<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Subtle border -->
  <rect x="2" y="2" width="508" height="508" rx="110" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4" />
  
  <!-- Glowing Progress Ring Accent -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="rgba(99,102,241,0.2)" stroke-width="24" />
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#brandGrad)" stroke-width="24" stroke-linecap="round" stroke-dasharray="1005" stroke-dashoffset="250" transform="rotate(-90 256 256)" filter="url(#glow)" />
  
  <!-- Central 'T' Emblem -->
  <path d="M 170 180 L 342 180 C 354 180 362 190 362 202 L 362 216 C 362 228 354 238 342 238 L 284 238 L 284 376 C 284 388 274 398 262 398 L 250 398 C 238 398 228 388 228 376 L 228 238 L 170 238 C 158 238 150 228 150 216 L 150 202 C 150 190 158 180 170 180 Z" fill="#FFFFFF" />
  
  <!-- Mini Graduation Star / Sparkle -->
  <circle cx="350" cy="160" r="16" fill="#38BDF8" filter="url(#glow)" />
</svg>
